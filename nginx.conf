worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    # Keep typical uploads (campaign/cover images) in memory instead of spilling
    # to a temp file on disk — silences the recurring nginx "a client request
    # body is buffered to a temporary file" warnings for normal image uploads.
    client_body_buffer_size 1m;

    # P2 perf: gzip text-based responses. Backend JSON is already compressed by
    # Express (Content-Encoding set) and is passed through untouched — nginx only
    # compresses responses that arrive uncompressed (e.g. proxied HTML/assets).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

    # Timeouts for slow upstream responses
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Larger proxy buffers to prevent "upstream response is buffered to a temporary file" warnings
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # --- Canonical host enforcement (SEO) ---------------------------------
    # 301 every non-primary host to the apex so the *.ondigitalocean.app
    # default ingress, dynopay.me and www.* don't serve a duplicate copy of
    # the site (wasted crawl budget / split signals). checkout.dynopay.com is
    # a first-class host and is intentionally NOT redirected. Keyed on $host
    # ONLY (never $scheme) so we can't create an http<->https loop behind the
    # TLS-terminating edge (Cloudflare/DO). /health and /api/* live in their
    # own location blocks below, so the DO health probe and inbound webhooks
    # are never turned into a 301.
    map $host $is_canonical_host {
        default              0;
        dynopay.com          1;
        checkout.dynopay.com 1;
    }

    upstream backend {
        server 127.0.0.1:3300;
    }

    upstream frontend {
        server 127.0.0.1:3000;
    }

    server {
        listen NGINX_PORT;

        # --- NextAuth routes (must go to Next.js, NOT Express backend) ---
        location /api/auth/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # --- Backend API routes ---
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # --- Health check (Railway healthcheck) ---
        location = /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # --- Backend static files (images, videos) ---
        location /images/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /videos/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # --- Swagger docs ---
        location /api/docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # --- Drop noisy vulnerability-scanner probes (PHP/WordPress/dotfiles) ---
        # DynoPay serves no PHP/WordPress; these paths are internet background
        # noise (wp-login.php, xmlrpc.php, /.env, /.git, phpMyAdmin, ...). Close
        # the connection without logging to keep access logs clean and avoid
        # proxying junk to the Next.js frontend.
        location ~* (\.php$|/wp-(admin|login|content|includes)|/wordpress|/xmlrpc|/phpmyadmin|/\.env|/\.git) {
            access_log off;
            return 444;
        }

        # --- Everything else -> Next.js frontend ---
        location / {
            # Canonical-host redirect (SEO): send any non-primary host to the
            # apex, preserving path + query. checkout.dynopay.com and
            # dynopay.com pass through ($is_canonical_host = 1). /health and
            # /api/* are matched by earlier location blocks and never reach here.
            if ($is_canonical_host = 0) {
                return 301 https://dynopay.com$request_uri;
            }

            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
