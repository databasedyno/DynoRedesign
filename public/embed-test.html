<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dynopay Embed Test (merchant page)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #111; }
    h1 { font-size: 20px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    button { padding: 10px 16px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 14px; }
    button:hover { background: #f5f5f5; }
    #status { font-size: 13px; color: #555; min-height: 18px; }
    #dynopay-checkout { margin-top: 16px; border: 1px dashed #ddd; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>Merchant test page</h1>
  <p>This simulates a merchant site embedding the Dynopay checkout via <code>/v1/embed.js</code>.</p>
  <p style="font-size:13px;color:#666">In production your <b>server</b> creates the session (POST <code>/api/user/embed/session</code> with your secret <code>x-api-key</code>) and returns <code>client_secret</code>. For this test page, pass it as <code>?cs=&lt;client_secret&gt;</code> in the URL.</p>
  <div class="row">
    <button id="mountBtn" data-testid="embed-mount-btn">Mount inline checkout</button>
    <button id="modalBtn" data-testid="embed-modal-btn">Open modal checkout</button>
  </div>
  <div id="status" data-testid="embed-status"></div>
  <div id="dynopay-checkout" data-testid="embed-inline-container"></div>

  <script>
    var params = new URLSearchParams(location.search);
    var CS = params.get('cs');
    function fetchClientSecret() { return Promise.resolve(CS); }
    function log(m) { document.getElementById('status').textContent = m; }
    if (!CS) log('Tip: add ?cs=<client_secret> to this URL to load a real session.');
  </script>
  <script src="/v1/embed.js"></script>
  <script>
    document.getElementById('mountBtn').addEventListener('click', async function () {
      if (!CS) { log('Missing ?cs=<client_secret> in URL'); return; }
      try {
        var checkout = await Dynopay.initEmbeddedCheckout({
          fetchClientSecret: fetchClientSecret,
          onReady: function () { log('Checkout ready (inline)'); },
          onComplete: function (id) { log('Payment success: ' + (id || '(webhook is source of truth)')); },
        });
        await checkout.mount('#dynopay-checkout');
        log('Mounted inline checkout');
      } catch (e) { log('Error: ' + e.message); }
    });
    document.getElementById('modalBtn').addEventListener('click', function () {
      if (!CS) { log('Missing ?cs=<client_secret> in URL'); return; }
      Dynopay.openCheckout({
        fetchClientSecret: fetchClientSecret,
        onReady: function () { log('Checkout ready (modal)'); },
        onComplete: function (id) { log('Payment success: ' + (id || '(webhook is source of truth)')); },
        onError: function (e) { log('Error: ' + e.message); },
      });
    });
  </script>
</body>
</html>
