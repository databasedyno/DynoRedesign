name: Droplet Diag (read-only)

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH read-only diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 4m
          script: |
            set +e
            echo "=== HOST ==="; hostname; date -u; uptime
            echo "=== DISK ==="; df -h /
            echo "=== INODES ==="; df -i / | tail -1
            echo "=== MEM ==="; free -m
            echo "=== DOCKER PS -A ==="; docker ps -a
            cd /opt/dynopay || echo "no /opt/dynopay"
            echo "=== COMPOSE IMAGE PIN ==="; grep -nE 'image:' docker-compose.yml
            echo "=== COMPOSE PS ==="; docker compose ps
            echo "=== INSPECT STATE ==="; docker inspect --format '{{json .State}}' dynopay 2>/dev/null
            echo "=== INSPECT HEALTH ==="; docker inspect --format '{{json .State.Health}}' dynopay 2>/dev/null
            echo "=== RESTART COUNT ==="; docker inspect --format 'RestartCount={{.RestartCount}}' dynopay 2>/dev/null
            echo "=== DOCKER LOGS (tail 500) ==="; docker logs dynopay --tail 500 2>&1
            echo "=== LOCAL HEALTH via nginx :8001 ==="; curl -s -m 5 -o /dev/null -w 'http_code=%{http_code}\n' http://127.0.0.1:8001/health || echo "curl failed"
            echo "=== BACKEND DIRECT :3300 (inside container) ==="; docker exec dynopay sh -c 'curl -s -m 5 -o /dev/null -w "backend3300=%{http_code}\n" http://127.0.0.1:3300/health' 2>&1 || echo "exec failed"
            echo "=== CADDY ==="; systemctl is-active caddy 2>/dev/null; systemctl status caddy --no-pager 2>/dev/null | head -15
            echo "=== DONE ==="
