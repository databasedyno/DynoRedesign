name: Preflight — type-check + exact Dockerfile build

# Belt-and-braces companion to the local Husky pre-commit hook
# (scripts/preflight-tsc.sh, which is WARN-only so Save-to-GitHub keeps
# working). If someone bypasses the hook with `git commit --no-verify`,
# uses Save-to-GitHub (which may not run local hooks), or pushes from a
# fresh clone without running `yarn install`, this GitHub Action still
# catches the exact same errors and marks the commit as failed —
# before the droplet deploy burns ~8 min on it.
#
# History
#   2026-07-13 — created after 5 back-to-back DO deploys failed on tsc
#   2026-08-02 (session 97d) — added `latest` branch and frontend job
#     after a TS2554 error on `latest` slipped through (previous CI only
#     watched `main` + `New-Onboarding2`). `latest` IS the DO deploy
#     branch on the `databasedyno/DynoRedesign` repo, so it MUST be gated.
#   2026-09-29 — now runs on EVERY push + PR (the deploy branch moved to
#     `Improvement`, which this workflow never watched), and gained the
#     `docker-build` job: the REAL `docker build` of ./Dockerfile (no push).
#     tsc on a full checkout cannot catch what the Dockerfile's selective
#     COPY list leaves out, nor a stale package that only exists in a
#     developer's node_modules — the 2026-09-29 deploy failure was exactly
#     that (`react-credit-cards-2` removed from package.json but still
#     imported; local tsc green, Docker `yarn build` red).
#
# tsc jobs run in <60s on a warm cache. docker-build is ~8–10 min cold and
# ~2–4 min on a warm GHA layer cache — and that cache is SHARED with
# deploy-droplet.yml (same build-args), so a green preflight makes the
# following deploy build mostly cache hits.

on:
  push:
    branches: ["**"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  # Cancel superseded runs — matches DO's "supersede" behavior on rapid pushes.
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Backend strict tsc — reproduces exactly what DigitalOcean's build runs
  # in the backend Dockerfile stage:
  #   RUN yarn install ...
  #   RUN yarn build           # ← this = tsc (per backend/package.json)
  #
  # If this job passes, `yarn build` on DO will pass. Period.
  # ─────────────────────────────────────────────────────────────────────
  backend-tsc:
    name: backend tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: backend/yarn.lock

      - name: Install backend deps
        working-directory: backend
        run: |
          yarn install --ignore-engines --production=false --frozen-lockfile \
            || yarn install --ignore-engines --production=false

      - name: Run tsc --noEmit (same as DO `yarn build`)
        working-directory: backend
        run: ./node_modules/.bin/tsc --noEmit

      # Hygiene gate (2026-10 audit removed ~2,180 unused backend imports): fails
      # when any import binding is unused. Fix locally with the same script minus --check.
      - name: No unused imports (backend)
        run: node scripts/qa/strip_unused_imports.cjs backend/tsconfig.json --check

  # ─────────────────────────────────────────────────────────────────────
  # Frontend strict tsc — HARD GATE (joined the club 2026-08-02 s97h).
  #
  # History
  #   Before s97e:   286 pre-existing errors, informational only
  #   s97e:          same 286 errors, added baseline-drift check (report-only)
  #   s97f (PR #1):  286 → 70 via dead-code deletes + type augments
  #   s97g (PR #2):  70 → 46 via DashboardLeftSection + policy pages fixes
  #   s97h (PR #3):  46 → 0 via full sweep — TRUE ZERO
  #
  # Now this job is a HARD FAIL like backend-tsc: any TypeScript error on
  # ANY push/PR to `latest`/`main`/`New-Onboarding2` blocks merge.
  # ─────────────────────────────────────────────────────────────────────
  frontend-tsc:
    name: frontend tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install frontend deps
        run: |
          yarn install --ignore-engines --production=false --frozen-lockfile \
            || yarn install --ignore-engines --production=false

      # next-env.d.ts is gitignored (Next regenerates it on every build). Without it
      # tsc has no `next/image-types/global` and every `.svg`/`.png` import fails with
      # TS2307 (273 errors on 2026-09-29). `next build` writes it itself — bare tsc must too.
      - name: Generate next-env.d.ts
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Run tsc --noEmit (strict — zero errors allowed)
        run: ./node_modules/.bin/tsc --noEmit

      # Hygiene gate (2026-10 audit): no unused import bindings in the frontend.
      - name: No unused imports (frontend)
        run: node scripts/qa/strip_unused_imports.cjs tsconfig.json --check --skip=backend,scripts

      # ESLint errors-only gate (moved out of `next build`, where it could not run).
      - name: ESLint (errors only)
        run: yarn lint:eslint

  # ─────────────────────────────────────────────────────────────────────
  # Exact Dockerfile build — the same `docker build` the deploy runs,
  # minus the push. Fails on anything tsc-on-a-checkout cannot see:
  # Dockerfile COPY omissions, lockfile drift, deps that only exist in a
  # developer's node_modules, `next build` prerender errors, backend tsc.
  # build-args mirror deploy-droplet.yml so the GHA layer cache is shared.
  # ─────────────────────────────────────────────────────────────────────
  docker-build:
    name: docker build ./Dockerfile (no push)
    # Minute-saver (2026-06): on a push to `Improvement`, deploy-droplet.yml already
    # runs this exact `docker build` as part of build-and-deploy. Both fire on the same
    # push, so preflight's copy gives no fast-fail head start — it just doubles the
    # ~10-min build and burns the free Actions allotment twice as fast (which is what
    # exhausted the quota and blocked deploys, 2026-10-08). Keep the heavy build only
    # where it is the ONLY build: PRs (pre-merge), manual dispatch, and pushes to any
    # OTHER branch that deploy-droplet does not build. The cheap tsc/unused-import/eslint
    # gates below still run on EVERY push, so real code errors still fail fast in <60s.
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'Improvement') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (exact deploy context, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_BUILD_CPUS=4
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_API_DOCS_URL=${{ secrets.NEXT_PUBLIC_API_DOCS_URL }}
            NEXT_PUBLIC_CYPHER_KEY=${{ secrets.NEXT_PUBLIC_CYPHER_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_ENABLE_GOOGLE_AUTH=${{ secrets.NEXT_PUBLIC_ENABLE_GOOGLE_AUTH }}
            NEXT_PUBLIC_ENABLE_GITHUB_AUTH=${{ secrets.NEXT_PUBLIC_ENABLE_GITHUB_AUTH }}
            NEXT_PUBLIC_GITHUB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
            NEXT_PUBLIC_ENABLE_CRYPTO_REFUNDS=${{ secrets.NEXT_PUBLIC_ENABLE_CRYPTO_REFUNDS }}
            NEXT_PUBLIC_CREATOR_BASE_URL=${{ secrets.NEXT_PUBLIC_CREATOR_BASE_URL }}
            NEXT_PUBLIC_REOWN_PROJECT_ID=${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}
            NEXT_PUBLIC_SHOW_SOCIAL_LINKS=${{ vars.NEXT_PUBLIC_SHOW_SOCIAL_LINKS }}
            NEXT_PUBLIC_ENABLE_PRODUCT_CATALOG=${{ vars.NEXT_PUBLIC_ENABLE_PRODUCT_CATALOG }}
            NEXT_PUBLIC_INLINE_TIP_CHECKOUT=${{ vars.NEXT_PUBLIC_INLINE_TIP_CHECKOUT }}
            NEXT_PUBLIC_CLEAN_CHECKOUT_V2=${{ vars.NEXT_PUBLIC_CLEAN_CHECKOUT_V2 }}
            NEXT_PUBLIC_CHECKOUT_SWR=${{ vars.NEXT_PUBLIC_CHECKOUT_SWR }}
            NEXT_PUBLIC_SAFEDEAL_COMPANY_ID=${{ vars.NEXT_PUBLIC_SAFEDEAL_COMPANY_ID }}
            NEXT_PUBLIC_GOOGLE_CLIENT_SECRET=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
