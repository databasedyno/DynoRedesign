name: Preflight — TypeScript type-check (backend + frontend)

# Belt-and-braces companion to the local Husky pre-commit hook
# (scripts/preflight-tsc.sh, which is WARN-only so Save-to-GitHub keeps
# working). If someone bypasses the hook with `git commit --no-verify`,
# uses Save-to-GitHub (which may not run local hooks), or pushes from a
# fresh clone without running `yarn install`, this GitHub Action still
# catches the exact same errors and marks the commit as failed —
# before DigitalOcean burns ~7½ min on it.
#
# History
#   2026-07-13 — created after 5 back-to-back DO deploys failed on tsc
#   2026-08-02 (session 97d) — added `latest` branch and frontend job
#     after a TS2554 error on `latest` slipped through (previous CI only
#     watched `main` + `New-Onboarding2`). `latest` IS the DO deploy
#     branch on the `databasedyno/DynoRedesign` repo, so it MUST be gated.
#
# Runs in <60s on a warm cache (yarn cache + node_modules cache).
# Runs in ~2m on a cold cache. Either way, orders of magnitude
# faster than a failed DO build.

on:
  push:
    branches:
      - latest       # DigitalOcean auto-deploys this branch — MUST gate
      - main
      - New-Onboarding2
  pull_request:
    branches:
      - latest
      - main
      - New-Onboarding2
  workflow_dispatch: {}

concurrency:
  # Cancel superseded runs — matches DO's "supersede" behavior on rapid pushes.
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Backend strict tsc — reproduces exactly what DigitalOcean's build runs
  # in the backend Dockerfile stage:
  #   RUN yarn install ...
  #   RUN yarn build           # ← this = tsc (per backend/package.json)
  #
  # If this job passes, `yarn build` on DO will pass. Period.
  # ─────────────────────────────────────────────────────────────────────
  backend-tsc:
    name: backend tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: backend/yarn.lock

      - name: Install backend deps
        working-directory: backend
        run: |
          yarn install --ignore-engines --production=false --frozen-lockfile \
            || yarn install --ignore-engines --production=false

      - name: Run tsc --noEmit (same as DO `yarn build`)
        working-directory: backend
        run: ./node_modules/.bin/tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────
  # Frontend strict tsc — NON-BLOCKING report only.
  #
  # Why non-blocking (continue-on-error: true):
  #   The frontend has ~286 pre-existing strict-tsc errors (largely from
  #   the MUI v6 → v7 typography-slot migration and legacy any-typed
  #   helpers). `next.config.js` sets `typescript.ignoreBuildErrors: true`
  #   which means DO's `next build` never enforces strict tsc. Making CI
  #   block on this today would break every merge until 286 legacy
  #   errors are fixed — which is a separate cleanup workstream.
  #
  #   Instead we run tsc and expose the count on the checks page so
  #   the trend is visible. When the backlog reaches 0, remove
  #   `continue-on-error: true` and this job becomes a hard gate too.
  # ─────────────────────────────────────────────────────────────────────
  frontend-tsc:
    name: frontend tsc --noEmit (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install frontend deps
        run: |
          yarn install --ignore-engines --production=false --frozen-lockfile \
            || yarn install --ignore-engines --production=false

      - name: Run tsc --noEmit (informational)
        run: |
          ./node_modules/.bin/tsc --noEmit 2>&1 | tee tsc-report.log || true
          COUNT=$(grep -c "error TS" tsc-report.log || echo 0)
          echo ""
          echo "======================================================"
          echo "Frontend tsc --noEmit total errors: ${COUNT}"
          echo "======================================================"
          # Fail if the count regresses ABOVE the pinned baseline.
          # Update this number when the backlog is intentionally reduced.
          # History: 286 → 282 (2026-08-02 s97e) → 70 (2026-08-02 s97f cleanup PR)
          BASELINE=70
          if [ "${COUNT}" -gt "${BASELINE}" ]; then
            echo "::error::Frontend tsc errors (${COUNT}) exceed baseline (${BASELINE}). New TypeScript drift detected."
            exit 1
          fi
          echo "Within baseline. OK."
