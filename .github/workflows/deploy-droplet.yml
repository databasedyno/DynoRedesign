name: Deploy to Droplet (Option C)

# Builds the combined DynoPay image, pushes to GHCR, and deploys to the
# DigitalOcean droplet over SSH. Requires the repo secrets listed below.
#
# Required GitHub repo secrets:
#   DEPLOY_HOST                     -> 134.209.94.115 (droplet public IPv4)
#   DEPLOY_SSH_KEY                  -> private key matching the droplet's authorized_keys
#   NEXTAUTH_URL, NEXTAUTH_SECRET
#   NEXT_PUBLIC_BASE_URL, NEXT_PUBLIC_SERVER_URL, NEXT_PUBLIC_API_DOCS_URL,
#   NEXT_PUBLIC_CYPHER_KEY, NEXT_PUBLIC_GOOGLE_CLIENT_ID, NEXT_PUBLIC_ENABLE_GOOGLE_AUTH,
#   NEXT_PUBLIC_ENABLE_GITHUB_AUTH, NEXT_PUBLIC_GITHUB_CLIENT_ID, NEXT_PUBLIC_ENABLE_CRYPTO_REFUNDS,
#   NEXT_PUBLIC_CREATOR_BASE_URL, NEXT_PUBLIC_GOOGLE_CLIENT_SECRET,
#   NEXT_PUBLIC_REOWN_PROJECT_ID   (Reown/WalletConnect public client id → enables "Pay with wallet")
# Optional repo VARIABLES (Settings → Variables; non-secret feature flags, may be unset):
#   NEXT_PUBLIC_SHOW_SOCIAL_LINKS, NEXT_PUBLIC_ENABLE_PRODUCT_CATALOG,
#   NEXT_PUBLIC_INLINE_TIP_CHECKOUT, NEXT_PUBLIC_CLEAN_CHECKOUT_V2, NEXT_PUBLIC_CHECKOUT_SWR,
#   NEXT_PUBLIC_SAFEDEAL_COMPANY_ID (=262; also honoured at runtime from the droplet .env)
#   (the browser reads these flags from server-provided runtime config, so the droplet
#   .env is the source of truth; build values only affect statically generated pages).
# GHCR auth uses the built-in GITHUB_TOKEN (packages: write).
#
# Post-deploy gate: `scripts/qa/hydration_guard.mjs` loads the public pages on the
# LIVE site at phone + desktop widths and fails the run on any React hydration error
# (#418/#423 = server HTML ≠ client render → whole-page client re-render → blank
# landing page on slow phones, 2026-09). Production-only class of bug, so it is
# checked against production.
#
# SAFE DEPLOY (2026-09-27, after the sharp/libvips crash-loop outage):
#   1. CANARY  — the new image is booted as a throw-away container beside the live
#                one (127.0.0.1:8002, background jobs OFF). If it never answers
#                /health the run fails, logs are printed, and the LIVE container is
#                never touched — the previous deployment keeps serving.
#   2. SWAP    — only a healthy canary is promoted: compose is re-pinned and the
#                live container recreated.
#   3. ROLLBACK— if the promoted container is not healthy within 180s the previous
#                image is re-pinned and recreated automatically, then the run fails.
#   The previous image is kept on disk so a manual rollback is instant
#   (workflow: droplet-rollback.yml).

on:
  push:
    branches: [Improvement]
  workflow_dispatch: {}

# Never cancel a deploy mid-flight (a killed SSH session during the swap would
# leave the droplet half-switched with nobody left to roll it back). Newer pushes
# queue behind the running deploy instead.
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/databasedyno/dynopay
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_BUILD_CPUS=4
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_API_DOCS_URL=${{ secrets.NEXT_PUBLIC_API_DOCS_URL }}
            NEXT_PUBLIC_CYPHER_KEY=${{ secrets.NEXT_PUBLIC_CYPHER_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_ENABLE_GOOGLE_AUTH=${{ secrets.NEXT_PUBLIC_ENABLE_GOOGLE_AUTH }}
            NEXT_PUBLIC_ENABLE_GITHUB_AUTH=${{ secrets.NEXT_PUBLIC_ENABLE_GITHUB_AUTH }}
            NEXT_PUBLIC_GITHUB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
            NEXT_PUBLIC_ENABLE_CRYPTO_REFUNDS=${{ secrets.NEXT_PUBLIC_ENABLE_CRYPTO_REFUNDS }}
            NEXT_PUBLIC_CREATOR_BASE_URL=${{ secrets.NEXT_PUBLIC_CREATOR_BASE_URL }}
            NEXT_PUBLIC_REOWN_PROJECT_ID=${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}
            NEXT_PUBLIC_SHOW_SOCIAL_LINKS=${{ vars.NEXT_PUBLIC_SHOW_SOCIAL_LINKS }}
            NEXT_PUBLIC_ENABLE_PRODUCT_CATALOG=${{ vars.NEXT_PUBLIC_ENABLE_PRODUCT_CATALOG }}
            NEXT_PUBLIC_INLINE_TIP_CHECKOUT=${{ vars.NEXT_PUBLIC_INLINE_TIP_CHECKOUT }}
            NEXT_PUBLIC_CLEAN_CHECKOUT_V2=${{ vars.NEXT_PUBLIC_CLEAN_CHECKOUT_V2 }}
            NEXT_PUBLIC_CHECKOUT_SWR=${{ vars.NEXT_PUBLIC_CHECKOUT_SWR }}
            NEXT_PUBLIC_SAFEDEAL_COMPANY_ID=${{ vars.NEXT_PUBLIC_SAFEDEAL_COMPANY_ID }}
            NEXT_PUBLIC_GOOGLE_CLIENT_SECRET=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}

      - name: Deploy over SSH (canary → swap → auto-rollback)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: GITHUB_ACTOR,GHCR_TOKEN,GITHUB_SHA,SAFEDEAL_API_KEY,SAFEDEAL_WEBHOOK_SECRET
          script: |
            set -e
            cd /opt/dynopay
            # SafeDeal (safedeal.sh) runs in the SAME container — Next middleware routes by Host.
            # Idempotently ensure env + a Caddy site block exist (Caddy auto-issues the LE cert once DNS resolves).
            [ -z "$(tail -c1 .env)" ] || echo >> .env
            grep -q '^SAFEDEAL_COMPANY_ID=' .env || echo 'SAFEDEAL_COMPANY_ID=262' >> .env
            grep -q '^SAFEDEAL_URL=' .env || echo 'SAFEDEAL_URL=https://safedeal.sh' >> .env
            # SafeDeal is an API-key merchant of Dynopay (funding via /api/user/cryptoPayment + signed webhooks).
            # Secrets come from GitHub → repo secrets SAFEDEAL_API_KEY / SAFEDEAL_WEBHOOK_SECRET (written once, never overwritten).
            if [ -n "$SAFEDEAL_API_KEY" ] && ! grep -q '^SAFEDEAL_API_KEY=' .env; then echo "SAFEDEAL_API_KEY=$SAFEDEAL_API_KEY" >> .env; fi
            if [ -n "$SAFEDEAL_WEBHOOK_SECRET" ] && ! grep -q '^SAFEDEAL_WEBHOOK_SECRET=' .env; then echo "SAFEDEAL_WEBHOOK_SECRET=$SAFEDEAL_WEBHOOK_SECRET" >> .env; fi
            if ! grep -q 'safedeal.sh' /etc/caddy/Caddyfile; then
              cp /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak.$(date +%s)
              printf '\nwww.safedeal.sh {\n\tredir https://safedeal.sh{uri} permanent\n}\n\nsafedeal.sh {\n\tencode gzip zstd\n\treverse_proxy 127.0.0.1:8001\n}\n' >> /etc/caddy/Caddyfile
              caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy
            fi
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            NEW_IMAGE="ghcr.io/databasedyno/dynopay:${GITHUB_SHA}"
            PREV_IMAGE="$(grep -E '^\s*image:' docker-compose.yml | head -1 | awk '{print $2}')"
            echo "previous image: ${PREV_IMAGE}"
            echo "new image:      ${NEW_IMAGE}"
            if [ "${PREV_IMAGE}" = "${NEW_IMAGE}" ] && curl -sf -m 5 -o /dev/null http://127.0.0.1:8001/health; then
              echo "already running a healthy ${NEW_IMAGE} — nothing to do"; docker compose ps; exit 0
            fi

            # Free disk BEFORE pulling: every deploy pins a new immutable SHA tag, so old
            # tagged images pile up (~1 GB each) → "no space left on device" mid-pull
            # (2026-09-24). `-a` removes every image not used by a running container;
            # the live one stays.
            echo "=== disk before cleanup ==="; df -h / | tail -1
            docker rm -f dynopay-canary >/dev/null 2>&1 || true
            docker image prune -af >/dev/null 2>&1 || true
            docker builder prune -af >/dev/null 2>&1 || true
            docker container prune -f >/dev/null 2>&1 || true
            journalctl --vacuum-size=200M >/dev/null 2>&1 || true
            echo "=== disk after cleanup ==="; df -h / | tail -1

            docker pull "${NEW_IMAGE}"

            # ── 1. CANARY ─────────────────────────────────────────────────────────
            # Boot the new image beside the live container. Same .env (via compose,
            # so quoting rules match production), but background jobs OFF so it can
            # never run sweeps/crons/leader election against the live DB. Health is
            # answered only after the backend finished booting (DB, migrations, ledger).
            cat > docker-compose.canary.yml <<EOF
            services:
              app:
                image: ${NEW_IMAGE}
                container_name: dynopay-canary
                env_file: .env
                environment:
                  ENABLE_BACKGROUND_JOBS: "false"
                  WORKER_ROLE: secondary
                  INDEXNOW_DISABLED: "true"
                ports:
                  - "127.0.0.1:8002:8001"
                restart: "no"
            EOF
            canary() { docker compose -p dynopay-canary -f docker-compose.canary.yml "$@"; }
            canary up -d
            canary_ok=0
            for i in $(seq 1 36); do
              if curl -sf -m 5 -o /dev/null http://127.0.0.1:8002/health; then canary_ok=1; echo "canary healthy after $((i*5))s"; break; fi
              if [ "$(docker inspect -f '{{.State.Running}}' dynopay-canary 2>/dev/null)" != "true" ]; then echo "canary process exited"; break; fi
              sleep 5
            done
            if [ "$canary_ok" != "1" ]; then
              echo "::error::Canary of ${NEW_IMAGE} never became healthy — live container NOT touched (still ${PREV_IMAGE})"
              echo "=== canary logs (tail 200) ==="; docker logs dynopay-canary --tail 200 2>&1 || true
              canary down --remove-orphans >/dev/null 2>&1 || true
              rm -f docker-compose.canary.yml
              docker rmi "${NEW_IMAGE}" >/dev/null 2>&1 || true
              docker compose ps
              exit 1
            fi
            canary down --remove-orphans >/dev/null 2>&1 || true
            rm -f docker-compose.canary.yml

            # ── 2. SWAP ───────────────────────────────────────────────────────────
            # Pin the immutable commit SHA (NOT the mutable :latest) so Compose sees a
            # changed image reference and actually recreates the container.
            cp docker-compose.yml docker-compose.yml.prev
            sed -i "s|image: .*|image: ${NEW_IMAGE}|" docker-compose.yml
            docker compose up -d --force-recreate
            live_ok=0
            for i in $(seq 1 36); do
              if curl -sf -m 5 -o /dev/null http://127.0.0.1:8001/health; then live_ok=1; echo "live healthy after $((i*5))s"; break; fi
              sleep 5
            done

            # ── 3. ROLLBACK ───────────────────────────────────────────────────────
            if [ "$live_ok" != "1" ]; then
              echo "::error::Live container on ${NEW_IMAGE} not healthy after 180s — rolling back to ${PREV_IMAGE}"
              echo "=== failed container logs (tail 200) ==="; docker logs dynopay --tail 200 2>&1 || true
              sed -i "s|image: .*|image: ${PREV_IMAGE}|" docker-compose.yml
              docker compose pull >/dev/null 2>&1 || true
              docker compose up -d --force-recreate
              for i in $(seq 1 36); do
                if curl -sf -m 5 -o /dev/null http://127.0.0.1:8001/health; then echo "rollback healthy after $((i*5))s"; break; fi
                sleep 5
              done
              docker compose ps
              exit 1
            fi

            # Keep exactly the new + previous image (instant rollback); drop older tags.
            docker images --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/databasedyno/dynopay:' \
              | grep -vxF -e "${NEW_IMAGE}" -e "${PREV_IMAGE}" | xargs -r docker rmi >/dev/null 2>&1 || true
            docker image prune -f >/dev/null 2>&1 || true
            echo "=== disk after deploy ==="; df -h / | tail -1
            # Self-verify in the run log which image the container is actually running.
            echo "=== deployed (expect tag ${GITHUB_SHA}) ==="
            docker compose images
            docker compose ps
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          SAFEDEAL_API_KEY: ${{ secrets.SAFEDEAL_API_KEY }}
          SAFEDEAL_WEBHOOK_SECRET: ${{ secrets.SAFEDEAL_WEBHOOK_SECRET }}

      - name: Wait for the new container to serve traffic
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 10 https://dynopay.com/health >/dev/null 2>&1; then
              echo "healthy after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "::error::https://dynopay.com/health not healthy after 180s"; exit 1

      - name: SafeDeal host check (non-blocking until DNS/TLS cut over)
        run: |
          if curl -fsS --max-time 15 https://safedeal.sh/ | grep -q 'sd-landing'; then
            echo "safedeal.sh serves the SafeDeal landing"
          else
            echo "::warning::https://safedeal.sh is not serving the SafeDeal landing yet (nameservers → DO + Caddy cert pending?)"
          fi

      - name: Setup Node.js (hydration guard)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Hydration guard — live site must hydrate cleanly
        run: |
          mkdir -p /tmp/hg && cp scripts/qa/hydration_guard.mjs /tmp/hg/
          cd /tmp/hg && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.61.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          GUARD_BASE_URL=https://dynopay.com node hydration_guard.mjs
